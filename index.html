<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VPN Finder для покер-румов</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <i class="fas fa-shield-alt"></i>
                <h1>VPN Finder</h1>
            </div>
            <p class="subtitle">Проверьте доступность страны для покер-румов</p>
        </header>

        <main class="main-content">
            <div class="cards-container">
                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-dice card-icon"></i>
                        <h2>Выберите румы</h2>
                    </div>
                    <div class="form-group">
                        <label>Начните вводить название рума:</label>
                        <div class="input-wrapper">
                            <input type="text" id="room-input" placeholder="Например: ПокерОк..." autocomplete="off">
                            <i class="fas fa-chevron-down input-icon"></i>
                            <div class="dropdown" id="room-dropdown"></div>
                        </div>
                        <div class="selected-tags" id="selected-rooms"></div>
                    </div>
                    <div class="results-section">
                        <div class="result-box">
                            <h3><i class="fas fa-check-circle icon-allowed"></i> Разрешённые страны</h3>
                            <div class="countries-grid" id="allowed-countries"></div>
                        </div>
                        <div class="result-box">
                            <h3><i class="fas fa-times-circle icon-disallowed"></i> Запрещённые страны</h3>
                            <div class="countries-grid" id="disallowed-countries"></div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <i class="fas fa-globe card-icon"></i>
                        <h2>Выберите страну</h2>
                    </div>
                    <div class="form-group">
                        <label>Начните вводить название страны:</label>
                        <div class="input-wrapper">
                            <input type="text" id="country-input" placeholder="Например: Россия..." autocomplete="off">
                            <i class="fas fa-search input-icon"></i>
                            <div class="dropdown" id="country-dropdown"></div>
                        </div>
                    </div>
                    <div class="result-box">
                        <h3><i class="fas fa-list-ul"></i> Доступность по румам</h3>
                        <div class="rooms-grid" id="rooms-by-country"></div>
                    </div>
                </div>
            </div>
        </main>

        <footer class="footer">
            <p>© 2026 VPN Finder для покер-румов</p>
            <p class="footer-note">Данные обновлены: январь 2026</p>
        </footer>
    </div>

    <button class="theme-toggle" id="theme-toggle" title="Сменить тему">
        <i class="fas fa-moon"></i>
    </button>

    <div class="toast-container" id="toast-container"></div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
